<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bombay Market</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fs-2 fw-bold"> Bombay Market </a>

        <div class="d-flex">
          <input
            id="searchBox"
            class="form-control me-2"
            placeholder="Search Product"
            onkeyup="searchProducts()"
          />

          <button
            class="btn btn-success me-2"
            data-bs-toggle="modal"
            data-bs-target="#productModal"
          >
            <i class="bi bi-plus-circle"></i>

            Add Product
          </button>

          <button
            class="btn btn-warning position-relative"
            data-bs-toggle="modal"
            data-bs-target="#cartModal"
          >
            <i class="bi bi-cart3 fs-4"></i>

            <span
              id="cartCount"
              class="badge bg-danger position-absolute top-0 start-100 translate-middle"
            >
              0
            </span>
          </button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2 class="text-center mb-4">Our Products</h2>

      <div class="row" id="productArea"></div>
    </div>

    <div class="modal fade" id="productModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Add / Edit Product</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="productId" />

            <input
              type="text"
              id="title"
              class="form-control mb-3"
              placeholder="Product Name"
            />

            <input
              type="number"
              id="price"
              class="form-control mb-3"
              placeholder="Price"
            />

            <input
              type="text"
              id="image"
              class="form-control mb-3"
              placeholder="Image URL"
            />

            <button class="btn btn-primary w-100" onclick="saveProduct()">
              Save Product
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="cartModal">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5>🛒 My Cart</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <table class="table table-bordered text-center">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>

                  <th>Image</th>

                  <th>Name</th>

                  <th>Price</th>

                  <th>Quantity</th>

                  <th>Total</th>

                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="cartArea"></tbody>
            </table>

            <h4 class="text-end">
              Grand Total : ₹ <span id="grandTotal">0</span>
            </h4>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
