<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>

    <div class="container">

        <h1>Form Validation</h1>

        <form action="" id="form">

            <label for="email" id="email" >Email        : </label>
            <input type="text" id="email_name" placeholder="Enter your email" name="email">

            <br>
            <br>

            <label for="password" id="password">Password :</label>
            <input type="password" id="password_name" placeholder="Enter your password" name="password" >
            
            <br>
            <br>

            <button type="submit">Login</button>

            <br>

            <div id="result"></div>

        </form>
    </div>

    <script src="./form.js"></script>
    
</body>
</html>
