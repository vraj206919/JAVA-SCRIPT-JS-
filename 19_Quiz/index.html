<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Application</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="row">
    <div class="card shadow card-quiz rounded-3 p-3">

      <h2 class="text-center text-success">Quiz Application</h2>

      <div class="d-flex justify-content-between fs-4 mt-3">
        <p id="questionCount" class="text-primary"></p>
        <p id="timer" class="text-danger">Time 30s</p>
      </div>

      <p id="questionText" class="fs-3 text-center mt-3"></p>

      <div id="optionContainer" class="row row-gap-3 mt-2"></div>

      <button class="btn btn-success mt-4" onclick="nextQuestion()">
        Next
      </button>

      <div id="result" class="mt-3"></div>

    </div>
  </div>
</div>

<script src="script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
