<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row">

            <div class="card shadow quiz-card gap-2 rounded-3">

                <h2 class="text-center pt-2 text-success">
                    Quiz Application
                </h2>

                <div class="d-flex justify-content-between fs-4">

                    <p id="questionCounter" class="text-primary">
                        Question 1/10
                    </p>

                    <p id="timerDisplay" class="text-danger">
                        Time 30s
                    </p>

                </div>

                <p class="fs-3 text-center" id="quizQuestion">
                    Quiz Questions
                </p>

                <div id="optionsContainer" class="row">

                </div>

                <button class="btn btn-outline-primary">
                    Next
                </button>

            </div>

        </div>
    </div>

    <script src="./script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

</body>
</html>
